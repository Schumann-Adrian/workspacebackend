        slug:
          $ref: '#/components/schemas/Slug'
        nombre:
          type: string
        nombre_propietario:
          type: string
        email:
          $ref: '#/components/schemas/Email'
        telefono:
          $ref: '#/components/schemas/Telefono'
        direccion:
          type: string
          nullable: true
        descripcion:
          type: string
          nullable: true
        url_logo:
          type: string
          format: uri
          nullable: true
        zona_horaria:
          type: string
        intervalo_minutos:
          type: integer
        estado:
          $ref: '#/components/schemas/EstadoNegocio'
