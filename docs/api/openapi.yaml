      - hora_fin
      additionalProperties: false
      properties:
        dia_semana:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO-8601 (1 = lunes … 7 = domingo)
        hora_inicio:
          $ref: '#/components/schemas/Hora'
        hora_fin:
          $ref: '#/components/schemas/Hora'
    TipoBloqueo:
      type: string
      enum:
      - festivo
      - pausa
      - vacaciones
      - otro
