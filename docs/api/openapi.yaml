      description: |
        `trabajador_id` nulo bloquea todo el local. Si el bloqueo solapa citas pendientes devuelve 409
        `BLOQUEO_SOLAPA_CITAS` con los ids afectados en `details`, salvo `forzar=true`.
      x-roles:
