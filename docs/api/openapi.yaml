openapi: 3.0.3
info:
  title: BookFlow API
  version: 1.0.0
  description: |
    API REST multi-tenant de reservas para PyMEs de servicios (peluquerías, estética, fisioterapia…).

    Contrato **API-first** del backend de BookFlow (Sprint 2).

    * **Versionado:** la versión mayor va en la ruta (`/api/v1`). Ver `docs/api/convenciones.md`.
    * **Seguridad:** Bearer JWT (`Authorization: Bearer <token>`). El token incluye `sub` (id del usuario),
      `tid` (tenant_id, ausente en superadmin) y `rol`. El `tenant_id` **nunca** se acepta del cliente
      en endpoints privados: se toma del token (RNF-01).
    * **Roles:** cada operación indica en `x-roles` qué roles pueden invocarla.
      `superadmin`, `admin_negocio`, `trabajador`, `cliente`, `publico` (sin token).
    * **Errores:** formato único `{ code, message, details[] }` — catálogo en `docs/api/errores.md`.
    * **Paginación:** `?page=1&limit=20` → respuesta `{ data: [...], meta: { total, page, limit, total_pages } }`.
    * **CQS:** comandos (POST/PUT/PATCH/DELETE) y consultas (GET) separados; las consultas nunca modifican estado.
  contact:
    name: Equipo BookFlow
servers:
- url: http://localhost:8080/api/v1
  description: Local (Docker Compose)
- url: https://api.bookflow.example/api/v1
  description: Producción (ejemplo)
security:
- bearerAuth: []
tags:
- name: Autenticación
  description: Inicio de sesión, renovación y activación de cuenta (US-02)
- name: Negocios
  description: Alta de negocio y gestión global de suscriptores (US-01, RF-01, RF-03)
- name: Servicios
  description: Catálogo de servicios del local (US-03, RF-04)
- name: Trabajadores
  description: Plantilla y servicios que realiza cada trabajador (US-04, RF-05)
- name: Horarios
  description: Horario del local, turnos y bloqueos (US-05, RF-06)
- name: Reserva pública
  description: Reserva pública sin login, mobile-first (US-06, US-07, US-09, RF-07..RF-09, RF-12)
- name: Citas
  description: Agenda del local y gestión de estado de citas (US-08, US-09, RF-10..RF-12)
- name: Sistema
  description: Salud del servicio
paths:
  /salud:
    get:
      tags:
      - Sistema
      operationId: consultarSalud
      summary: Comprobación de salud (liveness/readiness)
      security: []
      x-roles:
      - publico
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                required:
                - estado
                properties:
                  estado:
                    type: string
                    enum:
                    - ok
                  base_datos:
                    type: string
                    enum:
                    - up
                    - down
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'
  /auth/iniciar-sesion:
    post:
      tags:
      - Autenticación
      operationId: iniciarSesion
      summary: Iniciar sesión (todos los roles)
      description: US-02 · Devuelve access token JWT (15 min) y refresh token (7 días).
      security: []
      x-roles:
      - publico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudInicioSesion'
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TokensSesion'
        '400':
          $ref: '#/components/responses/PeticionIncorrecta'
        '401':
          $ref: '#/components/responses/CredencialesInvalidas'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
  /auth/renovar-token:
    post:
      tags:
      - Autenticación
      operationId: renovarToken
      summary: Renovar el access token (rotación de refresh token)
      security: []
      x-roles:
      - publico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token_refresco
              properties:
                token_refresco:
                  type: string
                  minLength: 32
      responses:
        '200':
          description: Nuevos tokens
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TokensSesion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /auth/cerrar-sesion:
    post:
      tags:
      - Autenticación
      operationId: cerrarSesion
      summary: Cerrar sesión (revoca el refresh token)
      x-roles:
      - superadmin
      - admin_negocio
      - trabajador
      - cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token_refresco
              properties:
                token_refresco:
                  type: string
      responses:
        '204':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /auth/activar-cuenta:
    post:
      tags:
      - Autenticación
      operationId: activarCuenta
      summary: Activar cuenta y fijar contraseña
      description: |
        US-01 · El registro solo pide nombre de negocio, dueño, email y teléfono. El sistema envía
        un email con un token de activación de un solo uso (24 h) para que el dueño fije su contraseña.
      security: []
      x-roles:
      - publico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token_activacion
              - contrasena
              properties:
                token_activacion:
                  type: string
                contrasena:
                  $ref: '#/components/schemas/Contrasena'
      responses:
        '200':
          description: Cuenta activada; devuelve sesión iniciada
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TokensSesion'
        '410':
          description: Token de activación caducado o ya usado (`TOKEN_ACTIVACION_INVALIDO`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /auth/usuario-actual:
    get:
      tags:
      - Autenticación
      operationId: obtenerUsuarioActual
      summary: Datos del usuario autenticado
      x-roles:
      - superadmin
      - admin_negocio
      - trabajador
      - cliente
      responses:
        '200':
          description: Usuario actual
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /negocios/registro:
    post:
      tags:
      - Negocios
      operationId: registrarNegocio
      summary: Registro simplificado de negocio (US-01)
      description: |
        Crea el tenant (genera `tenant_id` inmutable y `slug` público), el usuario `admin_negocio`
        inactivo y envía el email de activación. Operación transaccional.
      security: []
      x-roles:
      - publico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRegistroNegocio'
            example:
              nombre_negocio: Peluquería Ana
              nombre_propietario: Ana García
              email: ana@peluqueriaana.es
              telefono: +34 600 123 456
      responses:
        '201':
          description: Negocio registrado
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Negocio'
        '400':
          $ref: '#/components/responses/PeticionIncorrecta'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
  /negocios:
    get:
      tags:
      - Negocios
      operationId: listarNegocios
      summary: Listado global de negocios suscriptores (SuperAdmin)
      x-roles:
      - superadmin
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Busqueda'
      - name: estado
        in: query
        schema:
          $ref: '#/components/schemas/EstadoNegocio'
      - name: orden
        in: query
        schema:
          type: string
          enum:
          - nombre
          - -nombre
          - creado_en
          - -creado_en
          default: -creado_en
      responses:
        '200':
          description: Página de negocios
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Negocio'
                  meta:
                    $ref: '#/components/schemas/MetaPaginacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
  /negocios/{tenant_id}/estado:
    patch:
      tags:
      - Negocios
      operationId: cambiarEstadoNegocio
      summary: Activar / suspender un negocio (SuperAdmin)
      x-roles:
      - superadmin
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - estado
              properties:
                estado:
                  $ref: '#/components/schemas/EstadoNegocio'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Negocio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /perfil-negocio:
    get:
      tags:
      - Negocios
      operationId: obtenerPerfilNegocio
      summary: Perfil del negocio del usuario autenticado
      x-roles:
      - admin_negocio
      - trabajador
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Negocio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    patch:
      tags:
      - Negocios
      operationId: editarPerfilNegocio
      summary: Editar datos públicos del negocio (RF-03)
      x-roles:
      - admin_negocio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilNegocioActualizar'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Negocio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /servicios:
    get:
      tags:
      - Servicios
      operationId: listarServicios
      summary: Listar servicios del local
      x-roles:
      - admin_negocio
      - trabajador
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Busqueda'
      - name: activo
        in: query
        schema:
          type: boolean
      - name: orden
        in: query
        schema:
          type: string
          enum:
          - nombre
          - -nombre
          - precio
          - -precio
          - duracion_minutos
          - -duracion_minutos
          default: nombre
      responses:
        '200':
          description: Página de servicios
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Servicio'
                  meta:
                    $ref: '#/components/schemas/MetaPaginacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags:
      - Servicios
      operationId: crearServicio
      summary: Crear servicio (US-03)
      x-roles:
      - admin_negocio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicioCrear'
            example:
              nombre: Corte de pelo
              precio: 15.00
              duracion_minutos: 30
      responses:
        '201':
          description: Servicio creado
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Servicio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /servicios/{servicio_id}:
    parameters:
    - $ref: '#/components/parameters/ServicioId'
    get:
      tags:
      - Servicios
      operationId: obtenerServicio
      summary: Obtener un servicio
      x-roles:
      - admin_negocio
      - trabajador
      responses:
        '200':
          description: Servicio
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Servicio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    patch:
      tags:
      - Servicios
      operationId: editarServicio
      summary: Editar servicio (parcial)
      x-roles:
      - admin_negocio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicioActualizar'
      responses:
        '200':
          description: Servicio actualizado
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Servicio'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
    delete:
      tags:
      - Servicios
      operationId: eliminarServicio
      summary: Eliminar servicio
      description: |
        Si el servicio tiene citas asociadas se hace borrado lógico (`activo=false`) para conservar
        el histórico; si no, borrado físico. En ambos casos deja de ofrecerse en la reserva pública.
      x-roles:
      - admin_negocio
      responses:
        '204':
          description: Eliminado o desactivado
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Tiene citas pendientes futuras (`RECURSO_EN_USO`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trabajadores:
    get:
      tags:
      - Trabajadores
      operationId: listarTrabajadores
      summary: Listar plantilla
      x-roles:
      - admin_negocio
      - trabajador
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: activo
        in: query
        schema:
          type: boolean
      - name: servicio_id
        in: query
        description: Solo trabajadores que realizan este servicio
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Página de trabajadores
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trabajador'
                  meta:
                    $ref: '#/components/schemas/MetaPaginacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags:
      - Trabajadores
      operationId: crearTrabajador
      summary: Dar de alta a un trabajador (US-04)
      description: |
        Si se indica `crear_acceso=true` y `email`, se crea un usuario con rol `trabajador` y se le envía
        un email de activación. `servicio_ids` asigna los servicios que realiza.
      x-roles:
      - admin_negocio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrabajadorCrear'
      responses:
        '201':
          description: Trabajador creado
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Trabajador'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /trabajadores/{trabajador_id}:
    parameters:
    - $ref: '#/components/parameters/TrabajadorId'
    get:
      tags:
      - Trabajadores
      operationId: obtenerTrabajador
      summary: Obtener trabajador
      x-roles:
      - admin_negocio
      - trabajador
      responses:
        '200':
          description: Trabajador
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Trabajador'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    patch:
      tags:
      - Trabajadores
      operationId: editarTrabajador
      summary: Editar trabajador
      x-roles:
      - admin_negocio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrabajadorActualizar'
      responses:
        '200':
          description: Trabajador actualizado
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Trabajador'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
    delete:
      tags:
      - Trabajadores
      operationId: eliminarTrabajador
      summary: Dar de baja a un trabajador (borrado lógico si tiene citas)
      x-roles:
      - admin_negocio
      responses:
        '204':
          description: Baja realizada
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: Tiene citas pendientes futuras (`RECURSO_EN_USO`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trabajadores/{trabajador_id}/servicios:
    parameters:
    - $ref: '#/components/parameters/TrabajadorId'
    put:
      tags:
      - Trabajadores
      operationId: reemplazarServiciosTrabajador
      summary: Reemplazar los servicios que realiza un trabajador (US-04)
      description: Operación idempotente; el conjunto enviado sustituye al actual.
      x-roles:
      - admin_negocio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - servicio_ids
              properties:
                servicio_ids:
                  type: array
                  uniqueItems: true
                  maxItems: 100
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Trabajador con servicios actualizados
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Trabajador'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /trabajadores/{trabajador_id}/turnos:
    parameters:
    - $ref: '#/components/parameters/TrabajadorId'
    get:
      tags:
      - Horarios
      operationId: obtenerTurnosTrabajador
      summary: Turnos semanales del trabajador
      x-roles:
      - admin_negocio
      - trabajador
      responses:
        '200':
          description: Franjas semanales
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FranjaSemanal'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags:
      - Horarios
      operationId: reemplazarTurnosTrabajador
      summary: Reemplazar turnos semanales del trabajador (US-05)
      description: |
        Varias franjas el mismo día modelan la pausa recurrente (p. ej. 09:00-14:00 y 16:00-20:00).
        Las franjas no pueden solaparse entre sí ni salir del horario del local.
      x-roles:
      - admin_negocio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - franjas
              properties:
                franjas:
                  type: array
                  maxItems: 28
                  items:
                    $ref: '#/components/schemas/FranjaSemanal'
      responses:
        '200':
          description: Turnos guardados
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FranjaSemanal'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
