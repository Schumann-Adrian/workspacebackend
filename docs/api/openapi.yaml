openapi: 3.0.3
info:
  title: BookFlow API
  version: 1.0.0
  description: |
    API REST multi-tenant de reservas para PyMEs de servicios (peluquerías, estética, fisioterapia…).

    Contrato **API-first** del backend de BookFlow (Sprint 2).

    * **Versionado:** la versión mayor va en la ruta (`/api/v1`). Ver `docs/api/convenciones.md`.
    * **Seguridad:** Bearer JWT (`Authorization: Bearer <token>`). El token incluye `sub` (user_id),
      `tid` (tenant_id, ausente en super_admin) y `role`. El `tenant_id` **nunca** se acepta del cliente
      en endpoints privados: se toma del token (RNF-01).
    * **Roles:** cada operación indica en `x-roles` qué roles pueden invocarla.
      `super_admin`, `business_admin`, `worker`, `customer`, `public` (sin token).
    * **Errores:** formato único `{ code, message, details[] }` — catálogo en `docs/api/errores.md`.
    * **Paginación:** `?page=1&limit=20` → respuesta `{ data: [...], meta: { total, page, limit, total_pages } }`.
    * **CQS:** comandos (POST/PUT/PATCH/DELETE) y consultas (GET) separados; las consultas nunca modifican estado.
  contact:
    name: Equipo BookFlow
servers:
  - url: http://localhost:8080/api/v1
    description: Local (Docker Compose)
  - url: https://api.bookflow.example/api/v1
    description: Producción (ejemplo)
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Inicio de sesión, renovación y activación de cuenta (US-02)
  - name: Tenants
    description: Alta de negocio y gestión global de suscriptores (US-01, RF-01, RF-03)
  - name: Services
    description: Catálogo de servicios del local (US-03, RF-04)
  - name: Staff
    description: Plantilla y servicios que realiza cada trabajador (US-04, RF-05)
  - name: Schedules
    description: Horario del local, turnos y bloqueos (US-05, RF-06)
  - name: Public Booking
    description: Reserva pública sin login, mobile-first (US-06, US-07, US-09, RF-07..RF-09, RF-12)
  - name: Appointments
    description: Agenda del local y gestión de estado de citas (US-08, US-09, RF-10..RF-12)
  - name: System
    description: Salud del servicio

paths:
  # ------------------------------------------------------------------ System
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Comprobación de salud (liveness/readiness)
      security: []
      x-roles: [public]
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
                  database: { type: string, enum: [up, down] }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ------------------------------------------------------------------ Auth
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Iniciar sesión (todos los roles)
      description: US-02 · Devuelve access token JWT (15 min) y refresh token (7 días).
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Renovar el access token (rotación de refresh token)
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, minLength: 32 }
      responses:
        '200':
          description: Nuevos tokens
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Cerrar sesión (revoca el refresh token)
      x-roles: [super_admin, business_admin, worker, customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '204': { description: Sesión cerrada }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/activate:
    post:
      tags: [Auth]
      operationId: activateAccount
      summary: Activar cuenta y fijar contraseña
      description: |
        US-01 · El registro solo pide nombre de negocio, dueño, email y teléfono. El sistema envía
        un email con un token de activación de un solo uso (24 h) para que el dueño fije su contraseña.
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activation_token, password]
              properties:
                activation_token: { type: string }
                password: { $ref: '#/components/schemas/Password' }
      responses:
        '200':
          description: Cuenta activada; devuelve sesión iniciada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthTokens' }
        '410':
          description: Token de activación caducado o ya usado (`ACTIVATION_TOKEN_INVALID`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Datos del usuario autenticado
      x-roles: [super_admin, business_admin, worker, customer]
      responses:
        '200':
          description: Usuario actual
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ Tenants
  /tenants/register:
    post:
      tags: [Tenants]
      operationId: registerTenant
      summary: Registro simplificado de negocio (US-01)
      description: |
        Crea el tenant (genera `tenant_id` inmutable y `slug` público), el usuario `business_admin`
        inactivo y envía el email de activación. Operación transaccional.
      security: []
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantRegisterRequest' }
            example:
              business_name: Peluquería Ana
              owner_name: Ana García
              email: ana@peluqueriaana.es
              phone: '+34 600 123 456'
      responses:
        '201':
          description: Negocio registrado
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /tenants:
    get:
      tags: [Tenants]
      operationId: listTenants
      summary: Listado global de negocios suscriptores (SuperAdmin)
      x-roles: [super_admin]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TenantStatus' }
        - name: sort
          in: query
          schema: { type: string, enum: [name, -name, created_at, -created_at], default: -created_at }
      responses:
        '200':
          description: Página de negocios
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Tenant' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tenants/{tenant_id}/status:
    patch:
      tags: [Tenants]
      operationId: updateTenantStatus
      summary: Activar / suspender un negocio (SuperAdmin)
      x-roles: [super_admin]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/TenantStatus' }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /business-profile:
    get:
      tags: [Tenants]
      operationId: getBusinessProfile
      summary: Perfil del negocio del usuario autenticado
      x-roles: [business_admin, worker]
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Tenants]
      operationId: updateBusinessProfile
      summary: Editar datos públicos del negocio (RF-03)
      x-roles: [business_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessProfileUpdate' }
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------ Services
  /services:
    get:
      tags: [Services]
      operationId: listServices
      summary: Listar servicios del local
      x-roles: [business_admin, worker]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [name, -name, price, -price, duration_minutes, -duration_minutes], default: name }
      responses:
        '200':
          description: Página de servicios
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Service' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Services]
      operationId: createService
      summary: Crear servicio (US-03)
      x-roles: [business_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceCreate' }
            example: { name: Corte de pelo, price: 15.00, duration_minutes: 30 }
      responses:
        '201':
          description: Servicio creado
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Service' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /services/{service_id}:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Services]
      operationId: getService
      summary: Obtener un servicio
      x-roles: [business_admin, worker]
      responses:
        '200':
          description: Servicio
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Service' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Services]
      operationId: updateService
      summary: Editar servicio (parcial)
      x-roles: [business_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceUpdate' }
      responses:
        '200':
          description: Servicio actualizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Service' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Services]
      operationId: deleteService
      summary: Eliminar servicio
      description: |
        Si el servicio tiene citas asociadas se hace borrado lógico (`is_active=false`) para conservar
        el histórico; si no, borrado físico. En ambos casos deja de ofrecerse en la reserva pública.
      x-roles: [business_admin]
      responses:
        '204': { description: Eliminado o desactivado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Tiene citas pendientes futuras (`RESOURCE_IN_USE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ------------------------------------------------------------------ Staff
  /staff-members:
    get:
      tags: [Staff]
      operationId: listStaffMembers
      summary: Listar plantilla
      x-roles: [business_admin, worker]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: service_id
          in: query
          description: Solo trabajadores que realizan este servicio
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Página de trabajadores
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StaffMember' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Staff]
      operationId: createStaffMember
      summary: Dar de alta a un trabajador (US-04)
      description: |
        Si se indica `create_login=true` y `email`, se crea un usuario con rol `worker` y se le envía
        un email de activación. `service_ids` asigna los servicios que realiza.
      x-roles: [business_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffMemberCreate' }
      responses:
        '201':
          description: Trabajador creado
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StaffMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff-members/{staff_id}:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    get:
      tags: [Staff]
      operationId: getStaffMember
      summary: Obtener trabajador
      x-roles: [business_admin, worker]
      responses:
        '200':
          description: Trabajador
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StaffMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Staff]
      operationId: updateStaffMember
      summary: Editar trabajador
      x-roles: [business_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffMemberUpdate' }
      responses:
        '200':
          description: Trabajador actualizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StaffMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Staff]
      operationId: deleteStaffMember
      summary: Dar de baja a un trabajador (borrado lógico si tiene citas)
      x-roles: [business_admin]
      responses:
        '204': { description: Baja realizada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Tiene citas pendientes futuras (`RESOURCE_IN_USE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /staff-members/{staff_id}/services:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    put:
      tags: [Staff]
      operationId: replaceStaffServices
      summary: Reemplazar los servicios que realiza un trabajador (US-04)
      description: Operación idempotente; el conjunto enviado sustituye al actual.
      x-roles: [business_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_ids]
              properties:
                service_ids:
                  type: array
                  uniqueItems: true
                  maxItems: 100
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Trabajador con servicios actualizados
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/StaffMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /staff-members/{staff_id}/schedules:
    parameters:
      - $ref: '#/components/parameters/StaffId'
    get:
      tags: [Schedules]
      operationId: getStaffSchedule
      summary: Turnos semanales del trabajador
      x-roles: [business_admin, worker]
      responses:
        '200':
          description: Franjas semanales
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WeeklySlot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Schedules]
      operationId: replaceStaffSchedule
      summary: Reemplazar turnos semanales del trabajador (US-05)
      description: |
        Varias franjas el mismo día modelan la pausa recurrente (p. ej. 09:00-14:00 y 16:00-20:00).
        Las franjas no pueden solaparse entre sí ni salir del horario del local.
      x-roles: [business_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots:
                  type: array
                  maxItems: 28
                  items: { $ref: '#/components/schemas/WeeklySlot' }
      responses:
        '200':
          description: Turnos guardados
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WeeklySlot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------ Schedules (local)
  /business-hours:
    get:
      tags: [Schedules]
      operationId: getBusinessHours
      summary: Horario semanal de apertura del local
      x-roles: [business_admin, worker]
      responses:
        '200':
          description: Franjas de apertura
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WeeklySlot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Schedules]
      operationId: replaceBusinessHours
      summary: Reemplazar horario semanal del local (US-05)
      x-roles: [business_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots:
                  type: array
                  maxItems: 28
                  items: { $ref: '#/components/schemas/WeeklySlot' }
            example:
              slots:
                - { weekday: 1, start_time: '09:00', end_time: '14:00' }
                - { weekday: 1, start_time: '16:00', end_time: '20:00' }
      responses:
        '200':
          description: Horario guardado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WeeklySlot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /time-blocks:
    get:
      tags: [Schedules]
      operationId: listTimeBlocks
      summary: Listar bloqueos (festivos, pausas, vacaciones)
      x-roles: [business_admin, worker]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: staff_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Página de bloqueos
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TimeBlock' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Schedules]
      operationId: createTimeBlock
      summary: Crear bloqueo de horas o días (US-05)
      description: |
        `staff_id` nulo bloquea todo el local. Si el bloqueo solapa citas pendientes devuelve 409
        `BLOCK_OVERLAPS_APPOINTMENTS` con los ids afectados en `details`, salvo `force=true`.
      x-roles: [business_admin]
      parameters:
        - name: force
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimeBlockCreate' }
      responses:
        '201':
          description: Bloqueo creado
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TimeBlock' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /time-blocks/{time_block_id}:
    delete:
      tags: [Schedules]
      operationId: deleteTimeBlock
      summary: Eliminar bloqueo
      x-roles: [business_admin]
      parameters:
        - name: time_block_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Eliminado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ Public booking
  /public/businesses/{slug}:
    get:
      tags: [Public Booking]
      operationId: getPublicBusiness
      summary: Ficha pública del negocio con servicios y trabajadores activos
      security: []
      x-roles: [public]
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Negocio
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicBusiness' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/businesses/{slug}/availability:
    get:
      tags: [Public Booking]
      operationId: getAvailability
      summary: Huecos libres en tiempo real (US-06, RF-07)
      description: |
        Calcula las franjas libres para un servicio y fecha considerando: horario del local, turnos del
        trabajador, bloqueos, citas no canceladas y duración del servicio. Sin `staff_id` = "Cualquiera":
        devuelve la unión de huecos y, por hueco, los trabajadores disponibles.
        Objetivo de rendimiento: p50 < 300 ms (RNF-03). No se pagina (máx. 1 día).
      security: []
      x-roles: [public]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - name: service_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: true
          description: Fecha local del negocio (YYYY-MM-DD). No puede ser pasada ni superar 90 días.
          schema: { type: string, format: date }
        - name: staff_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Huecos disponibles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Availability' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /public/businesses/{slug}/appointments:
    post:
      tags: [Public Booking]
      operationId: createPublicAppointment
      summary: Reservar cita (US-07, RF-08, RF-09)
      description: |
        Endpoint **transaccional**. La BD garantiza que no haya solapes del mismo trabajador mediante
        una restricción `EXCLUDE` (RNF-04); si dos clientes reservan el mismo hueco a la vez, uno
        recibe `201` y el otro `409 SLOT_UNAVAILABLE`. El cliente se crea o reutiliza por email.
        Cabecera `Idempotency-Key` recomendada para reintentos seguros desde móvil.
        La respuesta incluye `cancel_token` (solo se devuelve aquí y por email) para cancelar sin login.
      security: []
      x-roles: [public]
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicAppointmentCreate' }
            example:
              service_id: 7b0e1c1e-1a5a-4d55-9d6c-8b2f4b1f9a10
              staff_id: 0f6a2d0e-6b5e-4c3e-9b8e-3e4f5a6b7c8d
              starts_at: '2026-12-01T10:00:00+01:00'
              customer: { full_name: Laura Pérez, phone: '+34 611 222 333', email: laura@example.com }
      responses:
        '201':
          description: Cita confirmada
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicAppointmentConfirmation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/SlotUnavailable' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/appointments/{appointment_id}/cancel:
    patch:
      tags: [Public Booking]
      operationId: cancelPublicAppointment
      summary: Cancelar cita como cliente (US-09, RF-12)
      description: Requiere el `cancel_token` recibido al reservar. Libera el hueco al instante.
      security: []
      x-roles: [public]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancel_token]
              properties:
                cancel_token: { type: string, minLength: 32 }
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Cita cancelada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Appointment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  # ------------------------------------------------------------------ Appointments (local)
  /appointments:
    get:
      tags: [Appointments]
      operationId: listAppointments
      summary: Agenda del local (US-08, RF-10)
      description: |
        Consulta de citas por rango de fechas. El rol `worker` solo ve sus propias citas
        (el filtro `staff_id` se fuerza al suyo). Rango máximo 31 días.
      x-roles: [business_admin, worker]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: staff_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          style: form
          explode: false
          description: Uno o varios estados separados por coma
          schema:
            type: array
            items: { $ref: '#/components/schemas/AppointmentStatus' }
        - name: sort
          in: query
          schema: { type: string, enum: [starts_at, -starts_at], default: starts_at }
      responses:
        '200':
          description: Página de citas
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Appointment' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /appointments/{appointment_id}:
    get:
      tags: [Appointments]
      operationId: getAppointment
      summary: Detalle de cita
      x-roles: [business_admin, worker]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Cita
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /appointments/{appointment_id}/complete:
    patch:
      tags: [Appointments]
      operationId: completeAppointment
      summary: Marcar cita como atendida (US-08, RF-11)
      description: Transición válida solo `pending → completed`.
      x-roles: [business_admin, worker]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Cita atendida
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  /appointments/{appointment_id}/cancel:
    patch:
      tags: [Appointments]
      operationId: cancelAppointment
      summary: Cancelar cita desde el local (US-09, RF-12)
      description: Transición válida solo `pending → cancelled`. Libera el hueco al instante.
      x-roles: [business_admin, worker]
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Cita cancelada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token HS256/RS256, expira en 15 min. Claims: `sub`, `tid`, `role`, `iat`, `exp`, `jti`.

  headers:
    Location:
      description: URL del recurso creado
      schema: { type: string, format: uri-reference }

  parameters:
    Page:
      name: page
      in: query
      description: Número de página (1-based)
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Elementos por página
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: q
      in: query
      description: Búsqueda de texto (contiene, sin distinguir mayúsculas)
      schema: { type: string, maxLength: 80 }
    DateFrom:
      name: date_from
      in: query
      description: Fecha inicial incluida (YYYY-MM-DD, zona horaria del negocio). Por defecto hoy.
      schema: { type: string, format: date }
    DateTo:
      name: date_to
      in: query
      description: Fecha final incluida (YYYY-MM-DD). Por defecto = date_from.
      schema: { type: string, format: date }
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceId:
      name: service_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StaffId:
      name: staff_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppointmentId:
      name: appointment_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Slug:
      name: slug
      in: path
      required: true
      description: Identificador público del negocio (kebab-case)
      schema: { $ref: '#/components/schemas/Slug' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID generado por el cliente; reenvíos con la misma clave en 24 h devuelven la misma respuesta.
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: JSON mal formado (`MALFORMED_REQUEST`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: MALFORMED_REQUEST, message: El cuerpo de la petición no es JSON válido., details: [] }
    ValidationError:
      description: Error de validación (`VALIDATION_ERROR` u otro código de negocio 422)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: VALIDATION_ERROR
            message: La petición contiene campos no válidos.
            details:
              - { field: duration_minutes, issue: must_be_between, message: Debe estar entre 5 y 480. }
              - { field: name, issue: required, message: Campo obligatorio. }
    Unauthorized:
      description: Token ausente, inválido o caducado (`UNAUTHENTICATED` / `TOKEN_EXPIRED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: TOKEN_EXPIRED, message: El token de acceso ha caducado., details: [] }
    InvalidCredentials:
      description: Credenciales incorrectas (`INVALID_CREDENTIALS`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: INVALID_CREDENTIALS, message: Email o contraseña incorrectos., details: [] }
    Forbidden:
      description: Rol sin permiso, cuenta inactiva o negocio suspendido (`FORBIDDEN` / `TENANT_SUSPENDED` / `ACCOUNT_INACTIVE`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: FORBIDDEN, message: No tienes permiso para realizar esta acción., details: [] }
    NotFound:
      description: Recurso inexistente o de otro negocio (`NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: NOT_FOUND, message: Recurso no encontrado., details: [] }
    Conflict:
      description: Conflicto con el estado actual (p. ej. `EMAIL_ALREADY_REGISTERED`, `SERVICE_NAME_DUPLICATED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: EMAIL_ALREADY_REGISTERED
            message: Ya existe una cuenta con ese email.
            details: [ { field: email, issue: duplicated } ]
    SlotUnavailable:
      description: El hueco ya no está libre (`SLOT_UNAVAILABLE`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: SLOT_UNAVAILABLE
            message: Ese horario acaba de ser reservado. Elige otro hueco.
            details: [ { field: starts_at, issue: slot_taken } ]
    InvalidTransition:
      description: Transición de estado no permitida (`INVALID_STATUS_TRANSITION`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: INVALID_STATUS_TRANSITION
            message: No se puede cancelar una cita ya atendida.
            details: [ { field: status, issue: invalid_transition, message: completed → cancelled } ]
    TooManyRequests:
      description: Límite de peticiones superado (`RATE_LIMITED`). Ver cabecera Retry-After.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Dependencia caída (`SERVICE_UNAVAILABLE`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------- comunes
    Error:
      type: object
      description: Formato único de error. Ver docs/api/errores.md
      required: [code, message, details]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: Código estable, legible por máquina (UPPER_SNAKE_CASE)
          example: VALIDATION_ERROR
        message:
          type: string
          description: Mensaje legible para el usuario final (es-ES)
        details:
          type: array
          items: { $ref: '#/components/schemas/ErrorDetail' }
        trace_id:
          type: string
          description: Identificador de correlación (también en cabecera X-Request-Id)
    ErrorDetail:
      type: object
      required: [issue]
      properties:
        field:
          type: string
          description: Ruta del campo con notación de puntos (`customer.email`, `slots[2].end_time`)
        issue:
          type: string
          description: Código del problema (snake_case)
          example: required
        message: { type: string }
    PageMeta:
      type: object
      required: [total, page, limit, total_pages]
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total_pages: { type: integer, minimum: 0 }
    Uuid:
      type: string
      format: uuid
      readOnly: true
    Timestamp:
      type: string
      format: date-time
      readOnly: true
    Email:
      type: string
      format: email
      maxLength: 254
    Phone:
      type: string
      pattern: '^\+?[0-9 ]{9,20}$'
      example: '+34 600 123 456'
    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      writeOnly: true
      description: Mínimo 8 caracteres, al menos una letra y un número. Se almacena con bcrypt (coste 12).
    Slug:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      maxLength: 60
      example: peluqueria-ana
    Time:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      example: '09:00'
    Money:
      type: number
      format: decimal
      minimum: 0
      description: Importe en euros con 2 decimales como máximo (numeric(10,2) en BD; se redondea half-up en el servidor).
      example: 15.00

    # ---------- auth / usuarios
    Role:
      type: string
      enum: [super_admin, business_admin, worker, customer]
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 72 }
    AuthTokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Segundos hasta la caducidad del access token, example: 900 }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, email, full_name, role, tenant_id]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        tenant_id:
          type: string
          format: uuid
          nullable: true
          description: null para super_admin
        email: { $ref: '#/components/schemas/Email' }
        full_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        staff_id:
          type: string
          format: uuid
          nullable: true
          description: Ficha de plantilla asociada (worker / business_admin que atiende)

    # ---------- tenants
    TenantStatus:
      type: string
      enum: [active, suspended, cancelled]
    TenantRegisterRequest:
      type: object
      required: [business_name, owner_name, email, phone]
      additionalProperties: false
      properties:
        business_name: { type: string, minLength: 2, maxLength: 120 }
        owner_name: { type: string, minLength: 2, maxLength: 120 }
        email: { $ref: '#/components/schemas/Email' }
        phone: { $ref: '#/components/schemas/Phone' }
    BusinessProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        slug: { $ref: '#/components/schemas/Slug' }
        phone: { $ref: '#/components/schemas/Phone' }
        address: { type: string, maxLength: 255, nullable: true }
        description: { type: string, maxLength: 2000, nullable: true }
        logo_url: { type: string, format: uri, maxLength: 500, nullable: true }
        timezone: { type: string, example: Europe/Madrid }
        slot_step_minutes: { type: integer, enum: [5, 10, 15, 20, 30, 60] }
    Tenant:
      type: object
      required: [id, slug, name, owner_name, email, phone, timezone, slot_step_minutes, status, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }
        owner_name: { type: string }
        email: { $ref: '#/components/schemas/Email' }
        phone: { $ref: '#/components/schemas/Phone' }
        address: { type: string, nullable: true }
        description: { type: string, nullable: true }
        logo_url: { type: string, format: uri, nullable: true }
        timezone: { type: string }
        slot_step_minutes: { type: integer }
        status: { $ref: '#/components/schemas/TenantStatus' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }

    # ---------- servicios
    ServiceCreate:
      type: object
      required: [name, price, duration_minutes]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, maxLength: 500, nullable: true }
        price: { $ref: '#/components/schemas/Money' }
        duration_minutes: { type: integer, minimum: 5, maximum: 480, example: 30 }
        is_active: { type: boolean, default: true }
    ServiceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, maxLength: 500, nullable: true }
        price: { $ref: '#/components/schemas/Money' }
        duration_minutes: { type: integer, minimum: 5, maximum: 480 }
        is_active: { type: boolean }
    Service:
      type: object
      required: [id, name, price, duration_minutes, is_active, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { $ref: '#/components/schemas/Money' }
        duration_minutes: { type: integer }
        is_active: { type: boolean }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    ServiceSummary:
      type: object
      required: [id, name, price, duration_minutes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        duration_minutes: { type: integer }

    # ---------- plantilla
    StaffMemberCreate:
      type: object
      required: [display_name]
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 2, maxLength: 80 }
        email: { $ref: '#/components/schemas/Email' }
        phone: { $ref: '#/components/schemas/Phone' }
        create_login:
          type: boolean
          default: false
          description: Crea usuario `worker` y envía email de activación (requiere email)
        link_current_user:
          type: boolean
          default: false
          description: El business_admin se da de alta a sí mismo como trabajador
        service_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    StaffMemberUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 2, maxLength: 80 }
        email: { $ref: '#/components/schemas/Email' }
        phone: { $ref: '#/components/schemas/Phone' }
        is_active: { type: boolean }
    StaffMember:
      type: object
      required: [id, display_name, is_active, has_login, services, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        display_name: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        is_active: { type: boolean }
        has_login: { type: boolean, description: Tiene usuario asociado }
        services:
          type: array
          items: { $ref: '#/components/schemas/ServiceSummary' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    StaffSummary:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }

    # ---------- horarios
    WeeklySlot:
      type: object
      required: [weekday, start_time, end_time]
      additionalProperties: false
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO-8601 (1 = lunes … 7 = domingo)
        start_time: { $ref: '#/components/schemas/Time' }
        end_time: { $ref: '#/components/schemas/Time' }
    TimeBlockType:
      type: string
      enum: [holiday, break, vacation, other]
    TimeBlockCreate:
      type: object
      required: [type, starts_at, ends_at]
      additionalProperties: false
      properties:
        staff_id:
          type: string
          format: uuid
          nullable: true
          description: null = bloquea todo el local
        type: { $ref: '#/components/schemas/TimeBlockType' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        reason: { type: string, maxLength: 200 }
    TimeBlock:
      type: object
      required: [id, type, starts_at, ends_at, created_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        staff_id: { type: string, format: uuid, nullable: true }
        type: { $ref: '#/components/schemas/TimeBlockType' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        reason: { type: string, nullable: true }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    # ---------- reserva pública
    PublicBusiness:
      type: object
      required: [slug, name, timezone, services, staff]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }
        phone: { type: string }
        address: { type: string, nullable: true }
        description: { type: string, nullable: true }
        logo_url: { type: string, format: uri, nullable: true }
        timezone: { type: string }
        services:
          type: array
          items: { $ref: '#/components/schemas/ServiceSummary' }
        staff:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/StaffSummary'
              - type: object
                properties:
                  service_ids:
                    type: array
                    items: { type: string, format: uuid }
    Availability:
      type: object
      required: [date, timezone, service_id, duration_minutes, slots]
      properties:
        date: { type: string, format: date }
        timezone: { type: string }
        service_id: { type: string, format: uuid }
        duration_minutes: { type: integer }
        slots:
          type: array
          items:
            type: object
            required: [starts_at, ends_at, staff_ids]
            properties:
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }
              staff_ids:
                type: array
                minItems: 1
                items: { type: string, format: uuid }
    CustomerInput:
      type: object
      required: [full_name, phone, email]
      additionalProperties: false
      properties:
        full_name: { type: string, minLength: 2, maxLength: 120 }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { $ref: '#/components/schemas/Email' }
    PublicAppointmentCreate:
      type: object
      required: [service_id, starts_at, customer]
      additionalProperties: false
      properties:
        service_id: { type: string, format: uuid }
        staff_id:
          type: string
          format: uuid
          nullable: true
          description: null = "Cualquiera"; el sistema asigna el primer trabajador libre
        starts_at:
          type: string
          format: date-time
          description: Debe coincidir con un `starts_at` devuelto por /availability
        notes: { type: string, maxLength: 500 }
        customer: { $ref: '#/components/schemas/CustomerInput' }
    PublicAppointmentConfirmation:
      allOf:
        - $ref: '#/components/schemas/Appointment'
        - type: object
          required: [cancel_token]
          properties:
            cancel_token:
              type: string
              description: Secreto para cancelar sin login. Solo se devuelve en la creación.

    # ---------- citas
    AppointmentStatus:
      type: string
      enum: [pending, completed, cancelled]
    Appointment:
      type: object
      required: [id, status, starts_at, ends_at, price, service, staff, customer, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        price: { $ref: '#/components/schemas/Money' }
        notes: { type: string, nullable: true }
        service: { $ref: '#/components/schemas/ServiceSummary' }
        staff: { $ref: '#/components/schemas/StaffSummary' }
        customer:
          type: object
          required: [id, full_name, phone]
          properties:
            id: { type: string, format: uuid }
            full_name: { type: string }
            phone: { type: string }
            email: { type: string, format: email }
        cancelled_at: { type: string, format: date-time, nullable: true }
        cancelled_by: { type: string, enum: [customer, staff], nullable: true }
        cancellation_reason: { type: string, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
