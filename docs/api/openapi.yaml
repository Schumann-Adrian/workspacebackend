          type: string
          format: date-time
        motivo:
          type: string
          maxLength: 200
    Bloqueo:
      type: object
      required:
      - id
      - tipo
      - fecha_inicio
      - fecha_fin
      - creado_en
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        trabajador_id:
          type: string
          format: uuid
          nullable: true
        tipo:
          $ref: '#/components/schemas/TipoBloqueo'
        fecha_inicio:
          type: string
          format: date-time
        fecha_fin:
          type: string
          format: date-time
        motivo:
          type: string
          nullable: true
        creado_en:
          $ref: '#/components/schemas/FechaHora'
    NegocioPublico:
      type: object
      required:
      - slug
      - nombre
      - zona_horaria
      - servicios
      - trabajador
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        nombre:
          type: string
        telefono:
          type: string
        direccion:
          type: string
          nullable: true
        descripcion:
          type: string
          nullable: true
        url_logo:
          type: string
          format: uri
          nullable: true
        zona_horaria:
          type: string
        servicios:
          type: array
          items:
            $ref: '#/components/schemas/ServicioResumen'
        trabajadores:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/TrabajadorResumen'
            - type: object
              properties:
                servicio_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
    Disponibilidad:
      type: object
      required:
      - fecha
      - zona_horaria
      - servicio_id
      - duracion_minutos
      - franjas
      properties:
        fecha:
          type: string
          format: date
        zona_horaria:
          type: string
        servicio_id:
          type: string
          format: uuid
        duracion_minutos:
          type: integer
        franjas:
          type: array
          items:
            type: object
            required:
            - fecha_inicio
            - fecha_fin
            - trabajador_ids
            properties:
              fecha_inicio:
                type: string
                format: date-time
              fecha_fin:
                type: string
                format: date-time
              trabajador_ids:
                type: array
                minItems: 1
                items:
                  type: string
                  format: uuid
