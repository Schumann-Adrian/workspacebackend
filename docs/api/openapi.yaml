      x-roles:
      - admin_negocio
      - trabajador
      responses:
        '200':
          description: Franjas de apertura
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FranjaSemanal'
        '401':
          $ref: '#/components/responses/NoAutenticado'
    put:
      tags:
      - Horarios
      operationId: reemplazarHorarioLocal
      summary: Reemplazar horario semanal del local (US-05)
      x-roles:
      - admin_negocio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - franjas
              properties:
                franjas:
                  type: array
                  maxItems: 28
                  items:
                    $ref: '#/components/schemas/FranjaSemanal'
            example:
              franjas:
              - dia_semana: 1
                hora_inicio: 09:00
                hora_fin: 14:00
              - dia_semana: 1
                hora_inicio: 16:00
                hora_fin: 20:00
      responses:
        '200':
          description: Horario guardado
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FranjaSemanal'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /bloqueos-horario:
