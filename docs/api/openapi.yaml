      type: object
      required:
      - nombre_completo
      - telefono
      - email
      additionalProperties: false
      properties:
        nombre_completo:
          type: string
          minLength: 2
          maxLength: 120
        telefono:
          $ref: '#/components/schemas/Telefono'
        email:
          $ref: '#/components/schemas/Email'
    CitaPublicaCrear:
      type: object
      required:
      - servicio_id
      - fecha_inicio
      - cliente
      additionalProperties: false
      properties:
        servicio_id:
          type: string
          format: uuid
        trabajador_id:
          type: string
          format: uuid
          nullable: true
          description: null = "Cualquiera"; el sistema asigna el primer trabajador libre
        fecha_inicio:
          type: string
          format: date-time
          description: Debe coincidir con un `fecha_inicio` devuelto por /disponibilidad
        notas:
          type: string
          maxLength: 500
        cliente:
          $ref: '#/components/schemas/DatosCliente'
    ConfirmacionCita:
      allOf:
      - $ref: '#/components/schemas/Cita'
      - type: object
        required:
        - token_cancelacion
        properties:
          token_cancelacion:
            type: string
            description: Secreto para cancelar sin login. Solo se devuelve en la creación.
    EstadoCita:
      type: string
      enum:
      - pendiente
      - atendida
      - cancelada
    Cita:
      type: object
      required:
      - id
      - estado
      - fecha_inicio
      - fecha_fin
      - precio
      - servicio
      - trabajador
      - cliente
      - creado_en
      - actualizado_en
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        estado:
          $ref: '#/components/schemas/EstadoCita'
        fecha_inicio:
          type: string
          format: date-time
        fecha_fin:
          type: string
          format: date-time
        precio:
          $ref: '#/components/schemas/Importe'
        notas:
          type: string
          nullable: true
        servicio:
          $ref: '#/components/schemas/ServicioResumen'
        trabajador:
          $ref: '#/components/schemas/TrabajadorResumen'
        cliente:
          type: object
          required:
          - id
          - nombre_completo
          - telefono
          properties:
            id:
              type: string
              format: uuid
            nombre_completo:
              type: string
            telefono:
              type: string
            email:
              type: string
              format: email
        cancelada_en:
          type: string
          format: date-time
          nullable: true
        cancelada_por:
          type: string
          enum:
          - cliente
          - local
          nullable: true
        motivo_cancelacion:
          type: string
          nullable: true
        atendida_en:
          type: string
          format: date-time
          nullable: true
        creado_en:
          $ref: '#/components/schemas/FechaHora'
        actualizado_en:
          $ref: '#/components/schemas/FechaHora'
