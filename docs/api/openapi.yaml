  /publico/negocios/{slug}/disponibilidad:
    get:
      tags:
      - Reserva pública
      operationId: consultarDisponibilidad
      summary: Huecos libres en tiempo real (US-06, RF-07)
      description: |
        Calcula las franjas libres para un servicio y fecha considerando: horario del local, turnos del
        trabajador, bloqueos, citas no canceladas y duración del servicio. Sin `trabajador_id` = "Cualquiera":
        devuelve la unión de huecos y, por hueco, los trabajadores disponibles.
        Objetivo de rendimiento: p50 < 300 ms (RNF-03). No se pagina (máx. 1 día).
      security: []
      x-roles:
      - publico
      parameters:
      - $ref: '#/components/parameters/Slug'
      - name: servicio_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: fecha
        in: query
        required: true
        description: Fecha local del negocio (YYYY-MM-DD). No puede ser pasada ni superar 90 días.
        schema:
          type: string
          format: date
      - name: trabajador_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Huecos disponibles
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Disponibilidad'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
  /publico/negocios/{slug}/citas:
    post:
      tags:
      - Reserva pública
      operationId: reservarCita
      summary: Reservar cita (US-07, RF-08, RF-09)
      description: |
        Endpoint **transaccional**. La BD garantiza que no haya solapes del mismo trabajador mediante
        una restricción `EXCLUDE` (RNF-04); si dos clientes reservan el mismo hueco a la vez, uno
        recibe `201` y el otro `409 HUECO_NO_DISPONIBLE`. El cliente se crea o reutiliza por email.
        Cabecera `Idempotency-Key` recomendada para reintentos seguros desde móvil.
        La respuesta incluye `token_cancelacion` (solo se devuelve aquí y por email) para cancelar sin login.
      security: []
      x-roles:
      - publico
      parameters:
      - $ref: '#/components/parameters/Slug'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitaPublicaCrear'
            example:
              servicio_id: 7b0e1c1e-1a5a-4d55-9d6c-8b2f4b1f9a10
              trabajador_id: 0f6a2d0e-6b5e-4c3e-9b8e-3e4f5a6b7c8d
              fecha_inicio: '2026-12-01T10:00:00+01:00'
              cliente:
                nombre_completo: Laura Pérez
                telefono: +34 611 222 333
                email: laura@example.com
      responses:
        '201':
          description: Cita confirmada
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ConfirmacionCita'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/HuecoNoDisponible'
        '422':
          $ref: '#/components/responses/ErrorValidacion'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
  /publico/citas/{cita_id}/cancelar:
    patch:
      tags:
      - Reserva pública
      operationId: cancelarCitaCliente
      summary: Cancelar cita como cliente (US-09, RF-12)
      description: Requiere el `token_cancelacion` recibido al reservar. Libera el hueco al instante.
      security: []
      x-roles:
