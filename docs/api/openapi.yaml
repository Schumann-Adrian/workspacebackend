        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/TransicionInvalida'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token HS256/RS256, expira en 15 min. Claims: `sub`, `tid`, `rol`, `iat`, `exp`, `jti`.
  headers:
    Location:
      description: URL del recurso creado
      schema:
        type: string
        format: uri-reference
  parameters:
    Page:
      name: page
      in: query
      description: Número de página (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Elementos por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Busqueda:
      name: q
      in: query
      description: Búsqueda de texto (contiene, sin distinguir mayúsculas)
      schema:
        type: string
        maxLength: 80
    FechaDesde:
      name: fecha_desde
      in: query
      description: Fecha inicial incluida (YYYY-MM-DD, zona horaria del negocio). Por defecto hoy.
      schema:
        type: string
        format: date
    FechaHasta:
      name: fecha_hasta
      in: query
      description: Fecha final incluida (YYYY-MM-DD). Por defecto = date_from.
      schema:
        type: string
        format: date
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServicioId:
      name: servicio_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrabajadorId:
      name: trabajador_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CitaId:
      name: cita_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      description: Identificador público del negocio (kebab-case)
      schema:
        $ref: '#/components/schemas/Slug'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID generado por el cliente; reenvíos con la misma clave en 24 h devuelven la misma respuesta.
      schema:
        type: string
        format: uuid
  responses:
    PeticionIncorrecta:
      description: JSON mal formado (`PETICION_MAL_FORMADA`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PETICION_MAL_FORMADA
            message: El cuerpo de la petición no es JSON válido.
            details: []
    ErrorValidacion:
      description: Error de validación (`ERROR_VALIDACION` u otro código de negocio 422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: ERROR_VALIDACION
            message: La petición contiene campos no válidos.
            details:
            - field: duracion_minutos
              issue: fuera_de_rango
              message: Debe estar entre 5 y 480.
            - field: nombre
              issue: obligatorio
              message: Campo obligatorio.
    NoAutenticado:
      description: Token ausente, inválido o caducado (`NO_AUTENTICADO` / `TOKEN_CADUCADO`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: TOKEN_CADUCADO
            message: El token de acceso ha caducado.
            details: []
    CredencialesInvalidas:
      description: Credenciales incorrectas (`CREDENCIALES_INVALIDAS`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CREDENCIALES_INVALIDAS
            message: Email o contraseña incorrectos.
            details: []
    Prohibido:
      description: Rol sin permiso, cuenta inactiva o negocio suspendido (`PROHIBIDO` / `NEGOCIO_SUSPENDIDO` / 
        `CUENTA_INACTIVA`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: PROHIBIDO
            message: No tienes permiso para realizar esta acción.
            details: []
    NoEncontrado:
      description: Recurso inexistente o de otro negocio (`NO_ENCONTRADO`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NO_ENCONTRADO
            message: Recurso no encontrado.
            details: []
    Conflicto:
      description: Conflicto con el estado actual (p. ej. `EMAIL_YA_REGISTRADO`, `NOMBRE_SERVICIO_DUPLICADO`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: EMAIL_YA_REGISTRADO
            message: Ya existe una cuenta con ese email.
            details:
            - field: email
              issue: duplicado
    HuecoNoDisponible:
      description: El hueco ya no está libre (`HUECO_NO_DISPONIBLE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: HUECO_NO_DISPONIBLE
            message: Ese horario acaba de ser reservado. Elige otro hueco.
            details:
            - field: fecha_inicio
              issue: hueco_ocupado
    TransicionInvalida:
      description: Transición de estado no permitida (`TRANSICION_ESTADO_INVALIDA`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: TRANSICION_ESTADO_INVALIDA
            message: No se puede cancelar una cita ya atendida.
            details:
            - field: estado
              issue: transicion_invalida
              message: atendida → cancelada
    DemasiadasPeticiones:
      description: Límite de peticiones superado (`LIMITE_PETICIONES`). Ver cabecera Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServicioNoDisponible:
      description: Dependencia caída (`SERVICIO_NO_DISPONIBLE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: Formato único de error. Ver docs/api/errores.md
      required:
      - code
      - message
      - details
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          description: Código estable, legible por máquina (UPPER_SNAKE_CASE)
          example: ERROR_VALIDACION
        message:
          type: string
          description: Mensaje legible para el usuario final (es-ES)
        details:
          type: array
          items:
            $ref: '#/components/schemas/DetalleError'
        trace_id:
          type: string
          description: Identificador de correlación (también en cabecera X-Request-Id)
    DetalleError:
      type: object
      required:
      - issue
      properties:
        field:
          type: string
          description: Ruta del campo con notación de puntos (`cliente.email`, `franjas[2].hora_fin`)
        issue:
          type: string
          description: Código del problema (snake_case)
          example: required
        message:
          type: string
    MetaPaginacion:
      type: object
      required:
      - total
      - page
      - limit
      - total_pages
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total_pages:
          type: integer
          minimum: 0
    Uuid:
      type: string
      format: uuid
      readOnly: true
    FechaHora:
      type: string
      format: date-time
      readOnly: true
    Email:
      type: string
      format: email
      maxLength: 254
    Telefono:
      type: string
      pattern: '^\+?[0-9 ]{9,20}$'
      example: +34 600 123 456
    Contrasena:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      writeOnly: true
      description: Mínimo 8 caracteres, al menos una letra y un número. Se almacena con bcrypt (coste 12).
    Slug:
      type: string
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      maxLength: 60
      example: peluqueria-ana
    Hora:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      example: 09:00
    Importe:
      type: number
      format: decimal
      minimum: 0
      description: Importe en euros con 2 decimales como máximo (numeric(10,2) en BD; se redondea half-up en el 
        servidor).
      example: 15.00
    Rol:
      type: string
      enum:
      - superadmin
      - admin_negocio
      - trabajador
      - cliente
    SolicitudInicioSesion:
      type: object
      required:
      - email
      - contrasena
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
        contrasena:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 72
    TokensSesion:
      type: object
      required:
      - token_acceso
      - token_refresco
      - tipo_token
      - expira_en_segundos
      - usuario
      properties:
        token_acceso:
          type: string
        token_refresco:
          type: string
        tipo_token:
          type: string
          enum:
          - Bearer
        expira_en_segundos:
          type: integer
          description: Segundos hasta la caducidad del access token
