      - nombre
      - precio
      - duracion_minutos
      - activo
      - creado_en
      - actualizado_en
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        precio:
          $ref: '#/components/schemas/Importe'
        duracion_minutos:
          type: integer
        activo:
          type: boolean
