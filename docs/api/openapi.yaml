              properties:
                token_cancelacion:
                  type: string
                  minLength: 32
                motivo:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Cita cancelada
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Cita'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/TransicionInvalida'
  /citas:
